name: docs

# Build & terbitkan situs dokumentasi (Zudoku, folder docs/) ke GitHub Pages.
# Aktifkan sekali: Settings → Pages → Source: "GitHub Actions".
#
# Domain sendiri (mis. docs.etagih.id)? Kosongkan DOCS_BASE_PATH di bawah
# dan isi DOCS_SITE_URL dengan domain tersebut.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  # https://<user>.github.io/<repo>/ → base path = nama repo
  DOCS_BASE_PATH: /${{ github.event.repository.name }}
  DOCS_SITE_URL: https://${{ github.repository_owner }}.github.io

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tanggal "terakhir diubah" per halaman

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check config
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Siapkan artefak Pages
        run: |
          OUT="dist${DOCS_BASE_PATH}"
          # Dengan base path, halaman berada di dist/<repo>/; 404.html tetap di dist/.
          if [ -n "$DOCS_BASE_PATH" ]; then cp dist/404.html "$OUT/404.html"; fi
          echo "PAGES_DIR=docs/$OUT" >> "$GITHUB_ENV"

      - name: Upload artefak
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.PAGES_DIR }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
