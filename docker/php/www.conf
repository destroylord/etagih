; PHP-FPM pool — hemat RAM untuk VPS 1 GB.
; Tiap worker ±30–50 MB. `ondemand` mematikan worker yang menganggur.

[www]
listen = 9000

pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 20s
pm.max_requests = 500

; Untuk healthcheck container (cgi-fcgi → /ping).
ping.path = /ping
ping.response = pong

; Log PHP-FPM ke stdout/stderr container.
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
